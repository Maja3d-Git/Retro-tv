name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Retro TV APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RETROTV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "Podpis własnym kluczem Retro TV"
          else
            echo "Brak sekretu RETROTV_KEYSTORE_B64 - podpis kluczem testowym"
          fi

      - name: Build release APK (free, cores downloaded on demand)
        run: |
          chmod +x gradlew
          export RETROTV_KEYSTORE_PASSWORD="${{ secrets.RETROTV_KEYSTORE_PASSWORD }}"
          BUILD_TIME="$(TZ=Europe/Warsaw date '+%Y-%m-%d %H:%M')"
          ./gradlew --no-daemon :lemuroid-app:assembleFreeDynamicRelease \
            -PretrotvBuild=${{ github.run_number }} \
            "-PretrotvBuildTime=$BUILD_TIME"

      - name: Rename APK
        run: cp lemuroid-app/build/outputs/apk/freeDynamic/release/lemuroid-app-free-dynamic-release.apk retro-tv.apk

      - name: Release notes
        if: github.ref == 'refs/heads/main'
        run: |
          {
            git log -1 --format='%s%n%n%b' | grep -v -E '^(Co-Authored-By|Claude-Session):'
            echo
            echo "Wersja $(cat version.txt).${{ github.run_number }} · commit ${GITHUB_SHA::7}"
          } > release-notes.md
          cat release-notes.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro-tv-apk
          path: retro-tv.apk

      - name: Version name
        id: ver
        run: echo "name=$(cat version.txt).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Retro TV ${{ steps.ver.outputs.name }}
          make_latest: true
          body_path: release-notes.md
          files: retro-tv.apk

      # Zapasowe źródło aktualizacji: plik aplikacji i opis wersji na GitHub Pages
      # (inne serwery niż github.com – działa, gdy github.com jest niedostępny).
      - name: Prepare Pages site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site/update
          cp -r docs/. _site/
          cp retro-tv.apk _site/update/retro-tv.apk
          python3 - <<'PY'
          import json, os
          notes = open("release-notes.md", encoding="utf-8").read().strip()
          build = int(os.environ["RUN"])
          version = os.environ["VER"]
          json.dump({
              "build": build,
              "version": version,
              "title": "Retro TV " + version,
              "notes": notes,
              "apk": "retro-tv.apk",
          }, open("_site/update/latest.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
        env:
          RUN: ${{ github.run_number }}
          VER: ${{ steps.ver.outputs.name }}

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    name: Publish GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Jedna publikacja na raz – równoległe wdrożenia kończyły się błędem.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

